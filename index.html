<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Decision Dashboard | ರೈತ ನಿರ್ಧಾರ ಬೆಂಬಲ ವ್ಯವಸ್ಥೆ</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              50: '#f1f8e9', 100: '#dcedc8', 200: '#c5e1a5', 300: '#aed581',
              400: '#9ccc65', 500: '#7cb342', 600: '#558b2f', 700: '#33691e',
              800: '#2e7d32', 900: '#1b5e20', 950: '#0d3810',
            },
            earth: {
              50: '#fdfbf7', 100: '#f7f2ea', 200: '#ebdccb', 300: '#dec2a7',
              400: '#cca280', 500: '#b8855d', 600: '#9e6945', 700: '#7e4f35',
              800: '#643f2d', 900: '#4e3226',
            }
          }
        }
      }
    }
  </script>

  <!-- Resource Preconnections & DNS Prefetching for Ultra-Fast FDS & Low Latency -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.open-meteo.com">
  <link rel="dns-prefetch" href="https://nominatim.openstreetmap.org">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Leaflet CSS & JS for OpenStreetMap Interactive Farm Pinning -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Custom Styles & PWA Manifest -->
  <link rel="stylesheet" href="./static/css/styles.css" />
  <link rel="manifest" href="./static/manifest.json" />
  <meta name="theme-color" content="#1b5e20" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Zero-CLS & Performance Mode Inline Critical CSS -->
  <style>
    /* Prevent Cumulative Layout Shift (CLS) on Map and Stepper Containers */
    #farm-leaflet-map {
      min-height: 340px;
      aspect-ratio: 16 / 9;
      background: #f1f5f9;
    }
    .stepper-nav-bar {
      min-height: 52px;
    }
    /* Turbo / Performance Mode: Disable slow animations and transitions */
    .perf-mode * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  </style>
</head>
<body class="bg-transparent text-slate-800 min-h-screen font-sans flex flex-col antialiased relative">
  <!-- Persistent Looping Background Video (YouTube 85kTHwJ1Ju8 with HTML5 Fallback) -->
  <div id="persistent-bg-container" class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none -z-10" style="background-color: #0b150c;">
    <div id="bg-poster-fallback" class="absolute inset-0 w-full h-full bg-cover bg-center transition-opacity duration-700" style="background-image: url('./static/img/bg-poster.jpg'); opacity: 1;"></div>
    <div id="yt-bg-wrapper" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none transition-opacity duration-1000 opacity-0 overflow-hidden" style="width: 177.78vh; height: 56.25vw; min-width: 100vw; min-height: 100vh;">
      <div id="yt-bg-player" class="w-full h-full pointer-events-none"></div>
    </div>
    <video id="html5-bg-fallback-video" autoplay muted loop playsinline poster="./static/img/bg-poster.jpg" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 min-w-full min-h-full w-auto h-auto object-cover transition-opacity duration-1000 opacity-0 pointer-events-none">
      <source src="./static/videos/farmer_field.mp4" type="video/mp4">
      <source src="./static/videos/farmer_field.webm" type="video/webm">
    </video>
    <div id="bg-gradient-overlay" class="absolute inset-0 bg-gradient-to-b from-black/55 via-black/45 to-black/60 backdrop-blur-[1px]"></div>
  </div>
  <script src="./static/js/bg-video.js"></script>

  <!-- Dynamic Mount Point for Pure TypeScript Application with Zero-CLS Skeleton Shell -->
  <div id="app">
    <!-- Inline Skeleton Header: Renders in 0ms before JS runs to eliminate CLS and boost FDS -->
    <header class="bg-[#1b5e20] text-white shadow-md sticky top-0 z-40 h-16">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-[#2e7d32] flex items-center justify-center text-amber-300 text-xl shadow-inner">
            <i class="fa-solid fa-seedling"></i>
          </div>
          <div>
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
              <span>Farmer Decision Dashboard</span>
            </h1>
            <p class="text-[11px] text-emerald-200 hidden sm:block">AI Precision Agriculture • Weather • Economics</p>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <div class="h-8 w-24 bg-emerald-900/60 rounded-lg animate-pulse"></div>
        </div>
      </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1">
      <div class="h-12 bg-white rounded-2xl border border-slate-200 mb-6 animate-pulse"></div>
      <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm min-h-[400px] flex items-center justify-center">
        <div class="text-center space-y-3">
          <div class="text-3xl text-emerald-700 animate-spin"><i class="fa-solid fa-circle-notch"></i></div>
          <p class="text-xs text-slate-500 font-medium">Loading high-speed agronomic dashboard...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Client Application Script (Pure TypeScript/JavaScript bundle) -->
  <script type="module" src="./static/js/app.js?v=5.0"></script>
</body>
</html>
