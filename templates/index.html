      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;

    /* Primary Action Buttons: Solid Deep Emerald with Bright Crisp White Letters */
    button.bg-emerald-700, button.bg-emerald-700 *,

      font-weight: 800 !important;
    }
    #btn-step-prev:hover, #btn-retake-soil:hover {
      background: #dcfce7 !important;
    }
  </style>
